# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 先过规则回归与 PWA 自检，再发布。engine.js 没有 DOM 依赖，纯 Node 就能整局
  # 跑对局；PWA 那步会真开一个 headless Chrome，把 manifest、图标、分享卡元信息
  # 和「断网后能不能真的开一局」都实测一遍。改崩了就发不出去。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 固定 Node 22：check-pwa.mjs 用了全局 WebSocket（Node 22 起才默认可用），
      # 不能依赖 runner 上预装的版本
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法自检
        run: node tools/check-syntax.mjs
      - name: 规则回归（无头跑对局断言不变量）
        run: node tools/smoke.mjs
      - name: PWA 与分享卡自检（真开浏览器，含断网重载）
        # 只做校验，不重新生成 assets/：卡片与图标依赖 macOS 上的
        # 圆体（Yuanti SC），Linux runner 渲染结果必然不同，比对会恒假失败
        run: node tools/check-pwa.mjs

  # Single deploy job since we're just deploying
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # 只发布运行时文件，不整仓上传。
      # 之前用 path: '.' 把整个仓库都发布到 Pages，所以任何没进 .gitignore 的
      # 文件（当初的 .cert/key.pem 就是这么泄露的）都会自动出现在公网上。
      # 改成白名单后，仓库里新增的开发文件默认不会上线。
      - name: 组装发布目录
        run: |
          mkdir -p _site
          cp -R index.html styles.css sw.js manifest.webmanifest js assets _site/
          echo "--- 本次发布内容 ---"
          find _site -type f | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
