<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#2E6FBE">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="可爱动画风的大富翁棋盘游戏：买地、建房、收租、拍卖、破产，1 人对战 3 个 AI。">
<title>大富翁 · 地产小镇</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232E6FBE'/%3E%3Crect x='3' y='3' width='26' height='26' rx='8' fill='%23FFC93C'/%3E%3Crect x='6' y='6' width='20' height='20' rx='6' fill='%23FFFDF4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FF5C8A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ 背景装饰 ============ -->
<div class="bg" aria-hidden="true">
  <span class="bg__dots"></span>
  <span class="bg__rays"></span>
  <span class="bg__sun"></span>
  <span class="bg__cloud bg__cloud--1"></span>
  <span class="bg__cloud bg__cloud--2"></span>
  <span class="bg__cloud bg__cloud--3"></span>
</div>

<!-- ============ SVG 图标 sprite：2px 圆头描边，圆润造型 ============ -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-go" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h11M11 7.5l4.5 4.5-4.5 4.5"/></g>
    <g id="i-jail" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5v14M9.7 5v14M14.3 5v14M19 5v14M4 5.2h16M4 18.8h16"/></g>
    <g id="i-parking" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M9.6 16.8V7.6h3.6a2.9 2.9 0 0 1 0 5.8H9.6"/></g>
    <g id="i-chance" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9.4 9.6a2.7 2.7 0 1 1 3.8 2.5c-.8.4-1.2 1-1.2 1.9v.3"/><circle cx="12" cy="17.4" r="1.2" fill="currentColor" stroke="none"/></g>
    <g id="i-fate" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.6l2.2 5.4 5.4 2.2-5.4 2.2L12 18.8l-2.2-5.4L4.4 11.2l5.4-2.2z"/><path d="M18.4 16.6l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z"/></g>
    <g id="i-tax" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 17.5L17.5 6.5"/><circle cx="8.4" cy="8.4" r="2.4"/><circle cx="15.6" cy="15.6" r="2.4"/></g>
    <g id="i-rail" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="12.5" rx="4"/><path d="M5.5 9.4h13M9 16.5l-1.6 3M15 16.5l1.6 3"/><circle cx="9.2" cy="13" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.8" cy="13" r="1.1" fill="currentColor" stroke="none"/></g>
    <g id="i-bolt" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13.4 3L6 13.2h4.6L9.4 21 18 10.4h-4.7z"/></g>
    <g id="i-upgrade" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="M7 11l5-5 5 5"/><path d="M5 20h14"/></g>
    <g id="i-house" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3.8 11.4L12 4.4l8.2 7M6.2 10.2v8.6a1.4 1.4 0 0 0 1.4 1.4h8.8a1.4 1.4 0 0 0 1.4-1.4v-8.6"/><path d="M12 16.6c-1-.9-2.4-2-2.4-3.2a1.4 1.4 0 0 1 2.4-1 1.4 1.4 0 0 1 2.4 1c0 1.2-1.4 2.3-2.4 3.2z" fill="currentColor" stroke="none"/></g>
    <g id="i-dice" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="9" cy="9" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></g>
    <g id="i-coin" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.4v9.2M9.6 9.9h3.9a1.7 1.7 0 0 1 0 3.4H9.8"/></g>
    <g id="i-sound" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 9.6h3.1L11.4 6.2v11.6L7.6 14.4H4.5z"/><path d="M15.2 9.5a4 4 0 0 1 0 5M17.8 6.9a7.4 7.4 0 0 1 0 10.2"/></g>
    <g id="i-mute" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 9.6h3.1L11.4 6.2v11.6L7.6 14.4H4.5z"/><path d="M15 9.9l4.3 4.2M19.3 9.9L15 14.1"/></g>
    <g id="i-close" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></g>
    <g id="i-list" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4.5 7h15M4.5 12h15M4.5 17h9"/></g>
    <g id="i-book" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H17v15.5H6.5A1.5 1.5 0 0 1 5 18z"/><path d="M17 8.5h2.2V20H6.5"/></g>
    <g id="i-gear" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2v2.6M12 18.2v2.6M4.8 4.8l1.9 1.9M17.3 17.3l1.9 1.9M3.2 12h2.6M18.2 12h2.6M4.8 19.2l1.9-1.9M17.3 6.7l1.9-1.9"/></g>
    <g id="i-restart" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.6 12a7.6 7.6 0 1 1-2.5-5.6"/><path d="M19.6 4.6v4.2h-4.2"/></g>
    <g id="i-crown" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 17.4l1.6-8.2 4.2 3.4L12 6l2.2 6.6 4.2-3.4 1.6 8.2z"/><path d="M5.4 20.4h13.2"/></g>
    <g id="i-alert" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 4.4l8.4 15.2H3.6z"/><path d="M12 10.2v4M12 17.4h.01"/></g>
    <g id="i-menu" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></g>
    <g id="i-heart" fill="currentColor"><path d="M12 20s-7-4.3-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.7-7 9-7 9z"/></g>
  </defs>
</svg>

<div class="app" id="app">

  <header class="hud">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg class="ico"><use href="#i-house"></use></svg>
      </span>
      <span class="brand__text">
        <b class="brand__name">大富翁</b>
        <span class="brand__sub">地产小镇 · CUTE TYCOON</span>
      </span>
    </div>
    <div class="hud__tools">
      <button class="icon-btn" id="btnSound" type="button" aria-label="音效开关"></button>
      <button class="icon-btn" id="btnMenu" type="button" aria-label="菜单">
        <svg class="ico" aria-hidden="true"><use href="#i-menu"></use></svg>
      </button>
    </div>
  </header>

  <div class="strip" id="strip" role="list" aria-label="玩家"></div>

  <main class="stage">
    <div class="board" id="board">
      <div class="cells" id="cells"></div>
      <div class="hub" id="hub"></div>
      <div class="tokens" id="tokens"></div>
      <div class="fx" id="fx"></div>
    </div>
  </main>

  <div class="ticker" id="ticker">
    <div class="ticker__head"><span class="eyebrow">战报 · LEDGER</span></div>
    <div class="ticker__list" id="tickerList" aria-live="polite"></div>
  </div>

  <footer class="dock" id="dock">
    <button class="btn btn--ghost dock__side" id="btnAssets" type="button">
      <svg class="ico" aria-hidden="true"><use href="#i-list"></use></svg>
      <span class="btn__label">资产</span>
    </button>
    <button class="btn btn--primary dock__main" id="btnRoll" type="button" disabled>
      <svg class="ico" aria-hidden="true"><use href="#i-dice"></use></svg>
      <span class="btn__label">掷骰子</span>
    </button>
    <button class="btn btn--ghost dock__side" id="btnRules" type="button">
      <svg class="ico" aria-hidden="true"><use href="#i-book"></use></svg>
      <span class="btn__label">规则</span>
    </button>
  </footer>

</div>

<div class="sheet-layer" id="sheetLayer" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
