<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大富翁 · 应用图标</title>
<!--
  应用图标版式。由 tools/make-icons.mjs 渲染成 assets/ 下的各个尺寸。
  尺寸全部用 vmin 表达 —— 渲染时视口就等于图标边长，所以 1vmin 正好是图标的 1%，
  同一份 markup 可以渲染成 180 / 192 / 512 而不失真。

  构图：环形棋盘（12 格 · 四组地产色）+ 中心骰子。
  刻意避开「方块棋盘里套一个小房子」那种三层嵌套 —— 主体占满画面，
  缩到 16px 时剩下的仍是「一个带彩色刻度的圆环」，而不是一团糊掉的小方块。

  三种变体（URL 的 hash 切换）：
    #any       带圆角的完整图标 —— 浏览器标签、普通 PWA 图标
    #maskable  满幅背景、图形收进安全区 —— Android 自适应图标
    #apple     满幅方图、图形略大 —— iOS 主屏图标（系统自己切圆角）
  改完版式后重跑：node tools/make-icons.mjs
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  #icon {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    border-radius: 22.5%;
    overflow: hidden;
    background:
      radial-gradient(125% 125% at 50% 14%, #A8DBF9 0%, #6FB6EC 32%, #3D8FD8 64%, #16407E 100%);
  }
  /* 中心放射光，和棋盘中央的圆盘同源 */
  #icon::after {
    content: ""; position: absolute; inset: -30%;
    background: repeating-conic-gradient(from 0deg,
      rgba(255,255,255,.15) 0deg 6deg, rgba(255,255,255,0) 6deg 18deg);
    -webkit-mask-image: radial-gradient(closest-side, #000 6%, rgba(0,0,0,.5) 40%, transparent 72%);
            mask-image: radial-gradient(closest-side, #000 6%, rgba(0,0,0,.5) 40%, transparent 72%);
  }

  /* ── 环形棋盘 ──
     注意全局是 border-box，所以 width 就是**外径**：外径 68 − 环宽 10×2 = 内径 48，
     中径半径 (68 + 48) / 4 = 29vmin —— 环上格子的 translateY 必须跟这个数对上。
     外径留到 68 而不是更大，是因为环还有 2.6vmin 的金色厚度和投影，撑满会贴到画布边。 */
  .ring {
    position: absolute; left: 50%; top: 50%;
    width: 68vmin; height: 68vmin;
    margin: -34vmin 0 0 -34vmin;
    border-radius: 50%;
    border: 10vmin solid #FFFDF4;
    box-shadow: 0 2.6vmin 0 #D9A64C, 0 4vmin 7vmin rgba(11,42,84,.38);
  }
  /* 环的外缘一圈金色描线，给纯色环加一点层次 */
  .ring::after {
    content: ""; position: absolute; inset: -10vmin;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1.1vmin rgba(224,154,51,.45);
  }

  /* 环上的 12 格：四组地产色，每组 3 连格 */
  .cells { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 1; }
  .cell {
    position: absolute; left: 50%; top: 50%;
    width: 6.8vmin; height: 6.8vmin; margin: -3.4vmin 0 0 -3.4vmin;
    border-radius: 1.9vmin;
    box-shadow: 0 0 0 .8vmin #FFFDF4, 0 0 0 1.7vmin rgba(201,133,0,.20);
  }

  /* ── 中心骰子 ── */
  .die {
    position: relative; z-index: 2;
    width: 27vmin; height: 27vmin;
    border-radius: 7vmin;
    background: linear-gradient(180deg, #FFE9A8 0%, #FFC93C 62%, #EEA727 100%);
    border: 1.6vmin solid #FFFDF4;
    box-shadow: 0 2.2vmin 0 #C98500, 0 3.6vmin 6vmin rgba(11,42,84,.30);
    transform: rotate(-14deg);
  }
  .die span {
    position: absolute; width: 5.1vmin; height: 5.1vmin; border-radius: 999px;
    background: radial-gradient(circle at 34% 30%, #fff 0%, #FF6E8E 48%, #C93A66 100%);
    box-shadow: inset 0 .4vmin .8vmin rgba(150,30,66,.35);
  }
  .die span:nth-child(1) { left: 4.9vmin; top: 4.9vmin; }
  .die span:nth-child(2) { left: 10.95vmin; top: 10.95vmin; }
  .die span:nth-child(3) { left: 17vmin; top: 17vmin; }

  /* ── 变体 ── */
  /* Android 自适应图标：只有中间约 80% 的圆是安全区，整体收进来 */
  body[data-variant="maskable"] #icon { border-radius: 0; }
  body[data-variant="maskable"] .ring {
    width: 48vmin; height: 48vmin; margin: -24vmin 0 0 -24vmin;
    border-width: 7.2vmin;
  }
  body[data-variant="maskable"] .ring::after { inset: -7.2vmin; }
  body[data-variant="maskable"] .cell {
    width: 5vmin; height: 5vmin; margin: -2.5vmin 0 0 -2.5vmin;
    border-radius: 1.4vmin;
    box-shadow: 0 0 0 .6vmin #FFFDF4, 0 0 0 1.2vmin rgba(201,133,0,.20);
  }
  body[data-variant="maskable"] .die { width: 20vmin; height: 20vmin; border-radius: 5.2vmin; border-width: 1.2vmin; }
  body[data-variant="maskable"] .die span { width: 3.7vmin; height: 3.7vmin; }
  body[data-variant="maskable"] .die span:nth-child(1) { left: 3.6vmin; top: 3.6vmin; }
  body[data-variant="maskable"] .die span:nth-child(2) { left: 8.15vmin; top: 8.15vmin; }
  body[data-variant="maskable"] .die span:nth-child(3) { left: 12.7vmin; top: 12.7vmin; }

  /* iOS 自己切圆角，所以给满幅方图，图形略放大 */
  body[data-variant="apple"] #icon { border-radius: 0; }
  body[data-variant="apple"] .ring {
    width: 72vmin; height: 72vmin; margin: -36vmin 0 0 -36vmin;
    border-width: 10.5vmin;
  }
  body[data-variant="apple"] .ring::after { inset: -10.5vmin; }
  body[data-variant="apple"] .cell {
    width: 7.2vmin; height: 7.2vmin; margin: -3.6vmin 0 0 -3.6vmin;
    border-radius: 2vmin;
  }
  body[data-variant="apple"] .die { width: 28.5vmin; height: 28.5vmin; border-radius: 7.4vmin; }
  body[data-variant="apple"] .die span { width: 5.2vmin; height: 5.2vmin; }
  body[data-variant="apple"] .die span:nth-child(1) { left: 5.1vmin; top: 5.1vmin; }
  body[data-variant="apple"] .die span:nth-child(2) { left: 11.65vmin; top: 11.65vmin; }
  body[data-variant="apple"] .die span:nth-child(3) { left: 18.2vmin; top: 18.2vmin; }
</style>
</head>
<body data-variant="any">
  <div id="icon">
    <div class="ring"></div>
    <div class="cells" id="cells"></div>
    <div class="die"><span></span><span></span><span></span></div>
  </div>
<script>
  // 沿环的中径均匀铺 12 格，四组地产色各占 3 连格
  // （中径半径随变体不同，所以每格里单独算 translateY）
  var GROUPS = ['#FF5C8A', '#FFC93C', '#3FCECC', '#A97BF0'];

  function layoutCells() {
    var v = document.body.dataset.variant;
    // 中径半径 = (外径 + 内径) / 4，必须和上面每个变体的 border-width 保持一致
    var radius = v === 'maskable' ? 20.4 : (v === 'apple' ? 30.75 : 29);  // vmin
    var host = document.getElementById('cells');
    host.textContent = '';
    for (var i = 0; i < 12; i++) {
      var a = i * 30;
      var d = document.createElement('div');
      d.className = 'cell';
      d.style.background = GROUPS[Math.floor(i / 3) % GROUPS.length];
      d.style.transform = 'rotate(' + a + 'deg) translateY(-' + radius + 'vmin) rotate(' + (-a) + 'deg)';
      host.appendChild(d);
    }
  }

  // hash 决定变体（同文档换 hash 不会重跑 script，所以 make-icons.mjs 里还会显式同步一次）
  var v = (location.hash || '#any').slice(1);
  if (['any', 'maskable', 'apple'].indexOf(v) < 0) v = 'any';
  document.body.dataset.variant = v;
  layoutCells();
</script>
</body>
</html>
